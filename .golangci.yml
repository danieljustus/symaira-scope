# golangci-lint configuration for symscope.
# The configuration uses the golangci-lint v2 schema.

version: "2"

run:
  go: "1.26"
  modules-download-mode: readonly

linters:
  # Start from an explicit, stable set. The default v2 set includes
  # pre-existing errcheck, govet, misspell, and formatting findings that are
  # tracked separately rather than making this CI job permanently red.
  default: none
  enable:
    - bodyclose
    - ineffassign
    - unconvert
    - unused
    - whitespace
