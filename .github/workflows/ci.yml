name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
  schedule:
    - cron: '59 5 * * 1'  # weekly Monday 05:59 UTC — full suite incl. macOS/windows

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          args: --timeout=5m

  schema-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Go/Swift schema version alignment
        run: |
          GO_VERSION=$(sed -n 's/.*versionkit.New("symscope", version, \([0-9]*\)).*/\1/p' cmd/symscope/*.go | head -1)
          SWIFT_VERSION=$(sed -n 's/.*expectedSchemaVersion = \([0-9]*\).*/\1/p' client/Sources/SymscopeFeature/SymscopeModule.swift | head -1)
          if [ -z "$GO_VERSION" ]; then
            echo "::error::Could not extract schema version from cmd/symscope/*.go"
            exit 1
          fi
          if [ -z "$SWIFT_VERSION" ]; then
            echo "::error::Could not extract schema version from client/Sources/SymscopeFeature/SymscopeModule.swift"
            exit 1
          fi
          if [ "$GO_VERSION" != "$SWIFT_VERSION" ]; then
            echo "::error::Schema version mismatch! Go: $GO_VERSION, Swift: $SWIFT_VERSION"
            exit 1
          fi
          echo "Schema versions match: Go=$GO_VERSION, Swift=$SWIFT_VERSION"

  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # PR gate is ubuntu-only; macOS/windows run on main pushes and weekly schedule.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
